<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>1:1 屏幕尺寸对比工具</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="controls">
    <div class="control-group">
        <label>设备分类：</label>
        <select id="typeSelect">
            <option value="phone">手机 (Phone)</option>
            <option value="fold">折叠屏 (Foldable)</option>
            <option value="tablet">平板 (Tablet)</option>
        </select>
    </div>

    <div class="control-group">
        <label>选择设备：</label>
        <select id="deviceSelect"></select>
    </div>

    <div class="control-group">
        <label>屏幕缩放校准：</label>
        <input type="range" id="zoomRange" min="50" max="150" value="100">
        <span id="zoomVal">100%</span>
    </div>
    
    <button id="addBtn">添加对比</button>
    <button id="clearBtn">清空画布</button>
</div>

<div class="canvas" id="canvas">
    </div>

<script src="script.js"></script>
</body>
</html>
